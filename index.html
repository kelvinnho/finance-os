<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>家庭資金流向配置器</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-200 px-4 py-3">
    <div class="max-w-3xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div>
        <h1 class="text-lg font-bold text-slate-900">家庭資金流向配置器</h1>
        <p id="syncStatus" class="text-xs text-slate-500">本地快取模式（尚未連接 Google Drive）</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnGoogleSync" onclick="handleAuthClick()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium px-3 py-2 rounded-lg shadow-sm transition">
          連接 Google Drive
        </button>
        <button onclick="exportJSON()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-3 py-2 rounded-lg transition">
          匯出
        </button>
        <label class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-3 py-2 rounded-lg transition cursor-pointer">
          匯入
          <input type="file" accept=".json" onchange="importJSON(event)" class="hidden" />
        </label>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-5 space-y-6">
    <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-100">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">每月綜合入帳總額</label>
          <input type="number" id="inputIncome" onchange="updateIncome(this.value)"
            class="text-2xl font-bold text-slate-900 bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 w-44 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="grid grid-cols-3 gap-3 text-right">
          <div>
            <div class="text-xs text-slate-500">純營運開支</div>
            <div id="statOps" class="text-base font-bold text-slate-800">$0</div>
          </div>
          <div>
            <div class="text-xs text-slate-500">定投劃撥</div>
            <div id="statInv" class="text-base font-bold text-indigo-600">$0</div>
          </div>
          <div>
            <div class="text-xs text-slate-500">基礎流餘額</div>
            <div id="statBalance" class="text-base font-bold text-emerald-600">$0</div>
          </div>
        </div>
      </div>

      <div class="pt-4">
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">發薪日自動導流執行摘要</div>
        <div id="bankSummaryGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-2.5"></div>
      </div>
    </section>

    <div id="groupsContainer" class="space-y-4"></div>

    <div class="flex justify-center pt-2">
      <button onclick="addNewGroup()" class="text-sm text-blue-600 hover:text-blue-700 font-medium flex items-center gap-1 bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-xl transition">
        + 新增銀行帳戶分組
      </button>
    </div>
  </main>

  <script>
    const CLIENT_ID = '143100916134-a6tf0693ien5hh4h760usa1l38qkkrbi.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
    const FILE_NAME = 'finance_router_config_v1.json';

    const DEFAULT_STATE = {
      schemaVersion: "1.0.0",
      lastUpdated: new Date().toISOString(),
      income: 0,
      groups: [
        {
          id: "tf_bank",
          name: "TF Bank（出糧與剛性中樞）",
          color: "#1a73e8",
          items: [
            { id: "mortgage", label: "住宅物業供樓按揭", value: 0, max: 30000, step: 100, isInv: false },
            { id: "family", label: "長輩家用", value: 0, max: 20000, step: 500, isInv: false },
            { id: "manulife", label: "宏利基金定投", value: 0, max: 10000, step: 100, isInv: true },
            { id: "aia", label: "AIA 基金與壽險定投", value: 0, max: 5000, step: 50, isInv: true }
          ]
        },
        {
          id: "boc_bank",
          name: "BOC Bank（家庭公費池）",
          color: "#34a853",
          items: [
            { id: "food", label: "日常外食與家庭三餐", value: 0, max: 8000, step: 50, isInv: false },
            { id: "parking", label: "車位月租", value: 0, max: 5000, step: 10, isInv: false },
            { id: "helper", label: "工人薪資與相關分攤", value: 0, max: 5000, step: 50, isInv: false },
            { id: "mgmt", label: "大廈管理費（年化）", value: 0, max: 4000, step: 50, isInv: false },
            { id: "utils", label: "水電煤、網絡與訂閱", value: 0, max: 5000, step: 50, isInv: false },
            { id: "social", label: "社交節慶紅包與禮品", value: 0, max: 6000, step: 50, isInv: false },
            { id: "daily", label: "家庭日用消耗與網購", value: 0, max: 5000, step: 50, isInv: false },
            { id: "gas", label: "車輛油費與日常通勤", value: 0, max: 3000, step: 50, isInv: false }
          ]
        },
        {
          id: "ant_bank",
          name: "Ant Bank（高息預留及投資中轉池）",
          color: "#9334e6",
          items: [
            { id: "edu", label: "小孩學費與膳食年化", value: 0, max: 15000, step: 50, isInv: false },
            { id: "ib_voo", label: "IB 美股指數定投 (VOO)", value: 0, max: 20000, step: 100, isInv: true },
            { id: "ins_car", label: "年度保費、修車及地租攤銷", value: 0, max: 12000, step: 100, isInv: false }
          ]
        },
        {
          id: "personal_card",
          name: "個人專用卡 / 錢包（自由消費池）",
          color: "#f59e0b",
          items: [
            { id: "fun", label: "個人自由消費預算", value: 0, max: 8000, step: 100, isInv: false }
          ]
        }
      ]
    };

    let appState = JSON.parse(localStorage.getItem('finance_router_state')) || DEFAULT_STATE;
    let accessToken = null;
    let driveFileId = null;
    let saveTimeout = null;

    function render() {
      document.getElementById('inputIncome').value = appState.income;
      let totalOps = 0, totalInv = 0;
      const summaryGrid = document.getElementById('bankSummaryGrid');
      const container = document.getElementById('groupsContainer');
      summaryGrid.innerHTML = '';
      container.innerHTML = '';

      appState.groups.forEach((group, gIdx) => {
        let gOps = 0, gInv = 0;
        group.items.forEach(item => {
          if (item.isInv) gInv += Number(item.value);
          else gOps += Number(item.value);
        });
        totalOps += gOps;
        totalInv += gInv;

        summaryGrid.innerHTML += `
          <div class="bg-slate-50 rounded-xl p-2.5 border border-slate-200/80">
            <div class="text-[11px] font-medium text-slate-500 truncate">${group.name.split('（')[0]}</div>
            <div class="text-sm font-bold text-slate-900 mt-0.5">$${(gOps + gInv).toLocaleString()}</div>
            <div class="text-[10px] text-slate-400 mt-0.5">營 $${gOps.toLocaleString()} / 投 $${gInv.toLocaleString()}</div>
          </div>
        `;

        const itemsHtml = group.items.map((item, iIdx) => `
          <div class="py-3 border-b border-slate-100 last:border-0">
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <div class="flex items-center gap-2">
                <span class="text-sm font-medium text-slate-700">${item.label}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded ${item.isInv ? 'bg-indigo-50 text-indigo-600 font-semibold' : 'bg-slate-100 text-slate-500'}">
                  ${item.isInv ? '定投' : '營運'}
                </span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400">$</span>
                <input type="number" value="${item.value}" step="${item.step}"
                  onchange="updateItemValue(${gIdx}, ${iIdx}, this.value)"
                  class="w-20 text-right text-sm font-bold text-slate-900 bg-slate-50 border border-slate-200 rounded px-1.5 py-0.5" />
                <button onclick="deleteItem(${gIdx}, ${iIdx})" title="刪除項目" class="text-slate-300 hover:text-rose-500 text-xs px-1">✕</button>
              </div>
            </div>
            <input type="range" min="0" max="${item.max}" step="${item.step}" value="${item.value}"
              oninput="updateItemValue(${gIdx}, ${iIdx}, this.value)"
              class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600" />
          </div>
        `).join('');

        container.innerHTML += `
          <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
              <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full" style="background:${group.color}"></span>
                <h2 class="font-bold text-slate-800 text-sm sm:text-base">${group.name}</h2>
              </div>
              <div class="text-right">
                <span class="text-sm font-bold text-slate-900">$${(gOps + gInv).toLocaleString()}</span>
              </div>
            </div>
            <div class="divide-y divide-slate-100">${itemsHtml}</div>
            <div class="pt-3 mt-1 flex justify-end">
              <button onclick="addNewItem(${gIdx})" class="text-xs text-slate-500 hover:text-blue-600 font-medium">+ 新增分項</button>
            </div>
          </section>
        `;
      });

      const balance = appState.income - (totalOps + totalInv);
      document.getElementById('statOps').textContent = `$${totalOps.toLocaleString()}`;
      document.getElementById('statInv').textContent = `$${totalInv.toLocaleString()}`;
      const balEl = document.getElementById('statBalance');
      balEl.textContent = `${balance >= 0 ? '+' : ''}$${balance.toLocaleString()}`;
      balEl.className = `text-base font-bold ${balance >= 0 ? 'text-emerald-600' : 'text-amber-600'}`;
    }

    function updateIncome(val) {
      appState.income = Number(val) || 0;
      persistState();
      render();
    }

    function updateItemValue(gIdx, iIdx, val) {
      const num = Number(val) || 0;
      appState.groups[gIdx].items[iIdx].value = num;
      if (num > appState.groups[gIdx].items[iIdx].max) {
        appState.groups[gIdx].items[iIdx].max = Math.ceil(num * 1.5 / 1000) * 1000;
      }
      persistState();
      render();
    }

    function addNewItem(gIdx) {
      const label = prompt("輸入新項目名稱：");
      if (!label) return;
      const val = Number(prompt("輸入每月預設金額：", "1000")) || 0;
      const isInv = confirm("此項目是否屬於「投資/定投」？（按「確定」為定投，按「取消」為營運開支）");
      appState.groups[gIdx].items.push({
        id: 'item_' + Date.now(),
        label,
        value: val,
        max: Math.max(10000, val * 2),
        step: 50,
        isInv
      });
      persistState();
      render();
    }

    function deleteItem(gIdx, iIdx) {
      if (!confirm(`確定刪除「${appState.groups[gIdx].items[iIdx].label}」嗎？`)) return;
      appState.groups[gIdx].items.splice(iIdx, 1);
      persistState();
      render();
    }

    function addNewGroup() {
      const name = prompt("輸入新銀行帳戶名稱：");
      if (!name) return;
      appState.groups.push({
        id: 'group_' + Date.now(),
        name,
        color: '#0ea5e9',
        items: []
      });
      persistState();
      render();
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `finance_router_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.groups) {
            appState = parsed;
            persistState();
            render();
            alert('匯入成功！');
          }
        } catch (err) {
          alert('JSON 格式錯誤');
        }
      };
      reader.readAsText(file);
    }

    function persistState() {
      appState.lastUpdated = new Date().toISOString();
      localStorage.setItem('finance_router_state', JSON.stringify(appState));
      if (accessToken) {
        document.getElementById('syncStatus').textContent = '正在同步至 Google Drive...';
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(saveToGoogleDrive, 1500);
      }
    }

    function handleAuthClick() {
      if (!CLIENT_ID || CLIENT_ID === '143100916134-a6tf0693ien5hh4h760usa1l38qkkrbi.apps.googleusercontent.com') {
        alert('請先在 index.html 中填入你的 Google OAuth Client ID');
        return;
      }
      if (typeof google === 'undefined' || !google.accounts) {
        alert('Google 登入腳本尚未載入完成，請檢查網絡或停用廣告攔截器後重整頁面。');
        return;
      }
      document.getElementById('syncStatus').textContent = '正在喚起 Google 登入視窗...';
      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (resp) => {
          if (resp.error) {
            document.getElementById('syncStatus').textContent = `授權失敗：${resp.error}`;
            alert(`Google 授權失敗 (${resp.error})。\n請確認：\n1. 已在 Audience 加入你的 Gmail 為 Test User\n2. 已在 Clients 填入 https://kelvinnho.github.io`);
            return;
          }
          accessToken = resp.access_token;
          document.getElementById('btnGoogleSync').textContent = '已連接 Drive';
          await loadFromGoogleDrive();
        }
      });
      tokenClient.requestAccessToken({ prompt: 'select_account' });
    }

    async function loadFromGoogleDrive() {
      try {
        const res = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${FILE_NAME}'`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);

        if (data.files && data.files.length > 0) {
          driveFileId = data.files[0].id;
          const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const cloudState = await fileRes.json();
          if (new Date(cloudState.lastUpdated) > new Date(appState.lastUpdated)) {
            appState = cloudState;
            localStorage.setItem('finance_router_state', JSON.stringify(appState));
            render();
          }
          document.getElementById('syncStatus').textContent = '已與 Google Drive 雲端同步';
        } else {
          await saveToGoogleDrive();
        }
      } catch (e) {
        document.getElementById('syncStatus').textContent = `雲端錯誤：${e.message}`;
        alert(`Google Drive 讀寫失敗：\n${e.message}\n\n（若提示 API disabled，請至 Google Cloud 程式庫啟用 Google Drive API）`);
      }
    }

    async function saveToGoogleDrive() {
      try {
        const metadata = { name: FILE_NAME, parents: driveFileId ? undefined : ['appDataFolder'] };
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' }));

        const url = driveFileId
          ? `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`
          : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';

        const res = await fetch(url, {
          method: driveFileId ? 'PATCH' : 'POST',
          headers: { Authorization: `Bearer ${accessToken}` },
          body: form
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error?.message || `HTTP ${res.status}`);
        if (result.id) driveFileId = result.id;
        document.getElementById('syncStatus').textContent = `雲端已儲存 (${new Date().toLocaleTimeString()})`;
      } catch (e) {
        document.getElementById('syncStatus').textContent = `儲存失敗：${e.message}`;
      }
    }

    render();
  </script>
</body>
</html>
